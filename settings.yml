enabled:
  default: true
  type: bool

composer_button_group:
  default: "insertions"
  type: enum
  choices:
    - fontStyles
    - insertions
    - extras
  client: true

svg_icons:
  type: list
  list_type: compact
  default: "discourse-icon|fab-discourse|tooltip-icon|up-right-from-square|link|discourse-expand|message|far-comment|comment|archive-org-icon|discobot|user-secret|eye|fab-wikipedia-w|globe|paper-plane|circle-question|far-circle-question|circle-info|info|triangle-exclamation|share|thumbtack|star|sun"

preview_providers:
  type: objects
  default:
    - key: topic
      enabled: true
      label: Local Topic
      glyph_mode: icon
      icon: comment
      emoji: "💬"
      color: "var(--tertiary)"
      require_https: true
      timeout_ms: 3000
    - key: remote_topic
      enabled: true
      label: Remote Discourse Topic
      glyph_mode: icon
      icon: discourse-icon
      emoji: "🌐"
      color: "var(--success)"
      remote_hosts: "meta.discourse.org|community.cloudflare.com|noobish.me|discourse.tobiaseigen.org"
      require_https: true
      timeout_ms: 3000
    - key: external
      enabled: true
      label: External Link
      glyph_mode: icon
      icon: eye
      emoji: "🔗"
      color: "var(--success)"
      require_https: true
      timeout_ms: 3000
    - key: wikipedia
      enabled: true
      label: Wikipedia
      glyph_mode: icon
      icon: fab-wikipedia-w
      emoji: "📚"
      color: "#808080"
      require_https: true
      timeout_ms: 3000
    - key: onebox
      enabled: true
      label: Cooked Onebox
      glyph_mode: icon
      icon: link
      emoji: "📦"
      color: "var(--primary)"
      require_https: true
      timeout_ms: 3000
  schema:
    name: provider
    properties:
      key:
        type: enum
        required: true
        choices:
          - topic
          - remote_topic
          - external
          - wikipedia
          - onebox

      enabled:
        type: boolean
        default: true

      label:
        type: string
        required: true

      glyph_mode:
        type: enum
        default: icon
        choices:
          - none
          - icon
          - emoji

      icon:
        type: string

      emoji:
        type: string

      color:
        type: string

      remote_hosts:
        type: string

      require_https:
        type: boolean
        default: true

      timeout_ms:
        type: integer
        default: 3000

